server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = / {
        rewrite ^ /index.html last;
    }

    location = /schulimpfung {
        return 308 /schulimpfung/;
    }
    location /schulimpfung/ {
        set $school_upstream http://refclient-school-backend:5000;
        proxy_pass $school_upstream;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
    location / {
        set $refclient_upstream http://refclient-java-backend:8087;
        proxy_pass $refclient_upstream;
        proxy_set_header Host $http_host;
        proxy_buffering off;
    }
}
