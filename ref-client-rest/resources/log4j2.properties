status = error
name = PropertiesConfig

property.filename = ./log/ELGARefClient.log
 
# RollingFileAppender will print logs in a file, it will be rotated based on time (1 day) or size (100MB)
appender.rolling.type = RollingFile
appender.rolling.name = RollingFile
appender.rolling.Append=true
appender.rolling.fileName = ${filename}
appender.rolling.filePattern = ${filename}.debug-backup-%d{yyyyMMdd}-%i.log.gz
appender.rolling.filePermissions= rw-------
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n
appender.rolling.policies.type = Policies
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy

# parameter to change the interval of time from 1 day to another interval
appender.rolling.policies.time.interval = 1
appender.rolling.policies.time.modulate = true
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy

# parameter to change the size to rotate
appender.rolling.policies.size.size=100MB
appender.rolling.strategy.type = DefaultRolloverStrategy

#parameter to configure the count of files to keep. For example now 5 "old" files + the actual file will be kept
appender.rolling.strategy.max = 1

appender.console.type = Console
appender.console.name = consoleLogger
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n
 
#Logger for the EConnector
logger.ec.name = at.elga.ref

# set a logging level only for the EConnector logging (error, warn, info, debug, trace)
logger.ec.level = debug
logger.ec.additivity = false
logger.ec.appenderRef.rolling.ref = RollingFile
logger.ec.appenderRef.console.ref = consoleLogger

#Logger for all included packages
# set a logging level only for the EConnector logging (error, warn, info, debug, trace)
rootLogger.level = debug
rootLogger.additivity = false
rootLogger.appenderRef.rolling.ref = RollingFile
rootLogger.appenderRef.console.ref = consoleLogger
